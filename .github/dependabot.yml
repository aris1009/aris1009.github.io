version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    # Supply-chain cooldown: hold new releases for 7 days before opening a PR,
    # so a compromised version is likely caught/yanked before it can be merged.
    cooldown:
      default-days: 7
    assignees:
      - "aris1009"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    ignore:
      # Ignore major version updates for core dependencies
      - dependency-name: "@11ty/eleventy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]